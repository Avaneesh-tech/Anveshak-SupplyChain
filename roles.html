<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role | Anveshak</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='index.html'">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>ANVESHAK</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="index.html" class="nav-link">Traceability</a>
                <a href="index.html" class="nav-link">About Us</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-outline" onclick="window.location.href='login_roles.html'">Login</button>
                <button class="btn btn-primary" onclick="window.location.href='roles.html'">New User</button>
            </div>
        </div>
    </nav>
    <main style="padding-top: 80px;">
<section id="view-roles" class="view" style="display:block">
            <div class="center-container">
                <div class="text-center mb-8">
                    <h2 class="section-title">Select Your Role</h2>
                    <p class="section-subtitle">Join the Anveshak network to start tracing your supply chain.</p>
                </div>
                <div class="role-cards">
                    <div class="role-card" onclick="window.location.href='farmer/farmer_signup.html'">
                        <div class="role-icon">🌱</div>
                        <h3>Farmer</h3>
                        <p>Register crops and generate harvest batches</p>
                    </div>
                    <div class="role-card" onclick="window.location.href='processing/processing_signup.html'">
                        <div class="role-icon">🏭</div>
                        <h3>Processing Unit</h3>
                        <p>Manage processing, QC, and manufacturing</p>
                    </div>
                    <div class="role-card" onclick="window.location.href='logistics/logistics_signup.html'">
                        <div class="role-icon">🚚</div>
                        <h3>Logistics Provider</h3>
                        <p>Track dispatch, routing, and delivery</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
