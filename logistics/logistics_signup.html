<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Registration | Anveshak</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='../index.html'">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>ANVESHAK</span>
            </div>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../index.html" class="nav-link">Traceability</a>
                <a href="../index.html" class="nav-link">About Us</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-outline" onclick="window.location.href='../login_roles.html'">Login</button>
                <button class="btn btn-primary" onclick="window.location.href='../roles.html'">New User</button>
            </div>
        </div>
    </nav>
    <main style="padding-top: 80px;">
<section id="view-logistics-signup" class="view" style="display:block">
            <div class="auth-container">
                <div class="auth-card">
                    <h2 class="card-title">Logistics Provider Registration</h2>
                    <p class="card-subtitle mb-6">Manage supply chain delivery</p>
                    <form onsubmit="event.preventDefault(); app.register('logistics', document.getElementById('reg-id').value, document.getElementById('reg-pass').value, 'logistics_login.html')">
                        <div class="form-group">
                            <label>Company Name</label>
                            <input type="text" class="input-field" placeholder="Logistics Corp" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>Login ID</label>
                                <input type="text" id="reg-id" class="input-field" required>
                            </div>
                            <div class="form-group half">
                                <label>Password</label>
                                <input type="password" id="reg-pass" class="input-field" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full mt-4">Register Logistics Hub</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="../app.js"></script>
</body>
</html>
