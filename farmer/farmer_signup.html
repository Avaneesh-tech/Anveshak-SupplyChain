<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Registration | Anveshak</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='../index.html'">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>ANVESHAK</span>
            </div>
            <div class="nav-links">
                <a href="../index.html" class="nav-link">Home</a>
                <a href="../index.html" class="nav-link">Traceability</a>
                <a href="../index.html" class="nav-link">About Us</a>
            </div>
            <div class="nav-actions">
                <button class="btn btn-outline" onclick="window.location.href='../login_roles.html'">Login</button>
                <button class="btn btn-primary" onclick="window.location.href='../roles.html'">New User</button>
            </div>
        </div>
    </nav>
    <main style="padding-top: 80px;">
<section id="view-farmer-signup" class="view" style="display:block">
            <div class="auth-container">
                <div class="auth-card">
                    <h2 class="card-title">Farmer Registration</h2>
                    <p class="card-subtitle mb-6">Register your farm on the blockchain</p>
                    <form onsubmit="event.preventDefault(); app.registerFarmer(document.getElementById('farmer-name').value, document.getElementById('farmer-place').value, document.getElementById('farmer-crop').value)">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="farmer-name" class="input-field" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label>Place of Cultivation</label>
                            <input type="text" id="farmer-place" class="input-field" placeholder="District, State" required>
                        </div>
                        <div class="form-group">
                            <label>Crop Type</label>
                            <select id="farmer-crop" class="input-field" required>
                                <option value="" disabled selected>Select Crop</option>
                                <option value="tulsi">Tulsi</option>
                                <option value="ashwagandha">Ashwagandha</option>
                                <option value="neem">Neem</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group half">
                                <label>Age</label>
                                <input type="number" class="input-field" placeholder="Years" required>
                            </div>
                            <div class="form-group half">
                                <label>Area of Land</label>
                                <input type="text" class="input-field" placeholder="Acres" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full mt-4">Register on Blockchain</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="../app.js"></script>
</body>
</html>
